<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Customer Dashboard — Registry Progress</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #93c5fd; 
    --primary-dark: #60a5fa;
    --secondary: #fbcfe8; 
    --secondary-dark: #f472b6;
    --bg: #f8fafc; 
    --card: #ffffff; --text-main: #0f172a; --text-sub: #64748b;
    --success: #a7f3d0; 
    --success-text: #059669;
    --danger: #fecaca; 
    --danger-text: #e11d48;
  }
  * { box-sizing: border-box; font-family: 'Prompt', sans-serif; transition: all 0.2s ease; }
  body { background: var(--bg); color: var(--text-main); margin: 0; padding-bottom: 80px; }
  
  header { background: rgba(255,255,255,0.9); backdrop-filter: blur(10px); padding: 1rem 2rem; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #e2e8f0; position: sticky; top: 0; z-index: 1000; }
  .brand { font-size: 1.5rem; font-weight: 800; color: var(--primary-dark); display: flex; align-items: center; gap: 10px; }

  .container { max-width: 1200px; margin: 2rem auto; padding: 0 20px; }

  .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 15px; margin-bottom: 2rem; }
  .stat-card { background: #fff; padding: 20px; border-radius: 20px; border: 1px solid #e2e8f0; text-align: center; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); position: relative; overflow: hidden; }
  .stat-card::before { content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 4px; }
  .card-all::before { background: var(--primary); }
  .card-active::before { background: #e2e8f0; }
  .card-done::before { background: var(--success); }
  .card-fail::before { background: var(--danger); }
  .card-cancel::before { background: #cbd5e1; }

  .stat-value { font-size: 28px; font-weight: 800; color: var(--text-main); margin-bottom: 4px; }
  .stat-label { font-size: 13px; font-weight: 600; color: var(--text-sub); }

  .filter-box { background: #fff; padding: 24px; border-radius: 24px; border: 1px solid #e2e8f0; margin-bottom: 2rem; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.05); }
  .search-row { display: flex; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
  input { flex: 1; padding: 14px 20px; border: 2px solid #f1f5f9; border-radius: 12px; font-size: 16px; outline: none; background: #f8fafc; min-width: 250px; }
  input:focus { background: #fff; border-color: var(--primary); box-shadow: 0 0 0 4px rgba(147, 197, 253, 0.2); }
  .btn-load { background: var(--text-main); color: #fff; border: none; padding: 0 30px; border-radius: 12px; font-weight: 700; cursor: pointer; height: 54px; }

  .tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; scrollbar-width: none; }
  .tab-btn { padding: 10px 18px; border-radius: 50px; border: 1px solid #e2e8f0; background: #fff; color: var(--text-sub); cursor: pointer; font-weight: 600; white-space: nowrap; font-size: 13px; }
  .tab-btn.active { background: var(--primary); color: #1e40af; border-color: var(--primary); box-shadow: 0 4px 12px rgba(147, 197, 253, 0.3); }

  .card-container { background: #fff; border-radius: 24px; border: 1px solid #e2e8f0; overflow: hidden; }
  table { width: 100%; border-collapse: collapse; min-width: 600px; }
  th { background: #f8fafc; padding: 18px; text-align: left; color: var(--text-sub); border-bottom: 1px solid #e2e8f0; font-size: 12px; font-weight: 700; text-transform: uppercase; }
  td { padding: 20px; border-bottom: 1px solid #f8fafc; }
  
  .status-label { font-size: 13px; font-weight: 700; color: var(--text-main); display: block; margin-bottom: 6px; }
  .progress-bg { height: 10px; background: #f1f5f9; border-radius: 10px; overflow: hidden; }
  .progress-fill { height: 100%; border-radius: 10px; width: 0%; transition: width 1s ease-in-out; 
    background-image: linear-gradient(90deg, rgba(255,255,255,0.2) 25%, transparent 25%); background-size: 20px 20px;
  }
  .badge-pastel { padding: 4px 10px; border-radius: 8px; font-size: 11px; font-weight: 700; display: inline-block; margin-top: 5px; }
  .btn-outline { padding: 8px 16px; border-radius: 10px; border: 1px solid #e2e8f0; background: #fff; cursor: pointer; font-weight: 600; font-size: 14px; text-decoration: none; color: var(--text-main); display: inline-flex; align-items: center; gap: 8px; }
</style>
</head>
<body>

<header>
  <div class="brand">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 20V10M18 20V4M6 20v-4"/></svg>
    <span id="txt-brand">CUSTOMER DASHBOARD</span>
  </div>
  <div style="display: flex; gap: 10px;">
    <button id="langBtn" class="btn-outline" onclick="toggleLang()">🇹🇭 TH</button>
    <a href="customer.html" class="btn-outline" id="txt-nav-portal">📋 รายละเอียดข้อมูล</a>
  </div>
</header>

<div class="container">
  <div class="filter-box">
    <div class="search-row">
      <input id="access_code" placeholder="กรอกรหัสลูกค้า (RG-XXXX)...">
      <button id="btnLoad" class="btn-load">ดึงข้อมูล</button>
    </div>
    
    <div class="search-row" id="search-product-area" style="display:none">
      <input id="q_product" placeholder="🔍 ค้นหาชื่อการค้า..." oninput="render()">
    </div>

    <div id="txt-milestone-title" style="font-weight:700; margin-bottom:12px; font-size:14px; color:var(--text-sub)">🎯 ติดตามงานตามรายขั้นตอน:</div>
    <div class="tabs" id="tabBar">
      <button class="tab-btn active" onclick="setFilter('all')" id="tab-all">🌈 ทั้งหมด</button>
      <button class="tab-btn" onclick="setFilter('start')" id="tab-1">1. เริ่มต้น</button>
      <button class="tab-btn" onclick="setFilter('phase1')" id="tab-2">2. เฟส 1</button>
      <button class="tab-btn" onclick="setFilter('analysis')" id="tab-3">3. ผลวิเคราะห์</button>
      <button class="tab-btn" onclick="setFilter('trial')" id="tab-4">4. ผลทดลอง</button>
      <button class="tab-btn" onclick="setFilter('phase3')" id="tab-5">5. เฟส 3</button>
      <button class="tab-btn" onclick="setFilter('fail')" id="tab-fail" style="border-color: var(--danger); color: var(--danger-text);">❌ พบปัญหา</button>
    </div>
  </div>

  <div id="contentArea" style="display:none">
    <div class="stats-grid" id="statsArea"></div>

    <div id="txt-section-progress" style="font-weight:700; font-size:1.25rem; margin: 2rem 0 1.5rem">📊 ความคืบหน้างานปัจจุบัน</div>
    <div class="card-container" style="overflow-x: auto;">
      <table>
        <thead>
          <tr>
            <th style="width: 35%" id="th-product">รายการสินค้า</th>
            <th style="width: 35%" id="th-step">สถานะล่าสุด</th>
            <th id="th-note">หมายเหตุ</th>
          </tr>
        </thead>
        <tbody id="mainTbody"></tbody>
      </table>
    </div>

    <div id="txt-section-done" style="font-weight:700; font-size:1.1rem; margin: 3rem 0 1rem; color:var(--success-text)">✅ ดำเนินการสำเร็จเสร็จสิ้น</div>
    <div class="card-container" id="historyArea" style="background:#f0fdf422;"></div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://vyfjqpwmvjborjrrtpne.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ5ZmpxcHdtdmpib3JqcnJ0cG5lIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjQzMTI4NjcsImV4cCI6MjA3OTg4ODg2N30.pu9ItBYuuQbH53lJmUzPCU2MW67RvCHr2rzhk3UQUw4';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const $ = id => document.getElementById(id);

let globalData = [];
let activeFilter = 'all';
let currentLang = localStorage.getItem('lang') || 'th';

function hasVal(v){ return v && String(v).trim() !== '' && String(v).trim() !== '-'; }

function getActualStatusText(r, t) {
    if (hasVal(r.result_phase3)) return r.result_phase3;
    if (hasVal(r.plan_trial)) return r.plan_trial;
    if (hasVal(r.analysis_result)) return r.analysis_result;
    if (hasVal(r.result_phase1)) return r.result_phase1;
    return t.step_start;
}

function getMilestone(r) {
    if (hasVal(r.result_phase3)) return { pct: 95, key: 'phase3' };
    if (hasVal(r.plan_trial)) return { pct: 85, key: 'trial' };
    if (hasVal(r.analysis_result)) return { pct: 65, key: 'analysis' };
    if (hasVal(r.result_phase1)) return { pct: 45, key: 'phase1' };
    return { pct: 25, key: 'start' };
}

function getFailStepName(r, t) {
    const stripNum = (text) => text.includes('. ') ? text.split('. ')[1] : text;
    if (String(r.result_phase3 || '').includes('❌') || String(r.result_phase3 || '').includes('ไม่ผ่าน')) return stripNum(t.tab_5);
    if (String(r.plan_trial || '').includes('❌') || String(r.plan_trial || '').includes('ไม่ผ่าน')) return stripNum(t.tab_4);
    if (String(r.analysis_result || '').includes('❌') || String(r.analysis_result || '').includes('ไม่ผ่าน')) return stripNum(t.tab_3);
    if (String(r.result_phase1 || '').includes('❌') || String(r.result_phase1 || '').includes('ไม่ผ่าน')) return stripNum(t.tab_2);
    return null;
}

// เพิ่มคำแปลในส่วนที่ขาดหายไป
const translations = {
    th: {
        brand: "CUSTOMER DASHBOARD", nav_portal: "📋 รายละเอียดข้อมูล",
        tab_all: "🌈 ทั้งหมด", tab_1: "1. เริ่มต้น", tab_2: "2. เฟส 1", tab_3: "3. ผลวิเคราะห์", tab_4: "4. ผลทดลอง", tab_5: "5. เฟส 3",
        step_start: "เริ่มต้นยื่นคำขอ", common_label: "สามัญ", no_data: "ไม่พบข้อมูล",
        btn_load: "ดึงข้อมูล", search_placeholder: "กรอกรหัสลูกค้า (RG-XXXX)...", search_trade: "🔍 ค้นหาชื่อการค้า...", milestone_title: "🎯 ติดตามงานตามรายขั้นตอน:",
        stat_all: "ทั้งหมด", stat_active: "กำลังดำเนินการ", stat_done: "สำเร็จ", stat_fail: "พบปัญหา", stat_cancel: "ยกเลิก",
        pending_fix: "⚠️ รอเจ้าหน้าที่ตรวจ", section_progress: "📊 ความคืบหน้างานปัจจุบัน", section_done: "✅ ดำเนินการสำเร็จเสร็จสิ้น", section_cancel: "📁 รายการที่ยกเลิก/ไม่ขึ้นทะเบียน",
        renew_label: "ต่ออายุ", new_reg: "ขึ้นทะเบียนใหม่"
    },
    en: {
        brand: "CUSTOMER DASHBOARD", nav_portal: "📋 Detailed View",
        tab_all: "🌈 All Items", tab_1: "1. Started", tab_2: "2. Phase 1", tab_3: "3. Analysis", tab_4: "4. Trial", tab_5: "5. Phase 3",
        step_start: "Started", common_label: "Common Name", no_data: "No Data",
        btn_load: "Load Data", search_placeholder: "Enter Customer Code (RG-XXXX)...", search_trade: "🔍 Search Trade Name...", milestone_title: "🎯 Track progress by step:",
        stat_all: "All", stat_active: "Pending", stat_done: "Success", stat_fail: "Issues", stat_cancel: "Cancelled",
        pending_fix: "⚠️ Pending Fix", section_progress: "📊 Current Progress", section_done: "✅ Completed Tasks", section_cancel: "📁 Cancelled / Non-Registered Items",
        renew_label: "Renewal", new_reg: "New Registration"
    }
};

function render() {
    const t = translations[currentLang];
    const q = ($('q_product').value || '').trim().toLowerCase();

    // 1. แยกกลุ่มข้อมูล
    const isCancelled = r => (r.renewed_status || '').includes('ยกเลิก') || (r.renewed_status || '').includes('ไม่ขึ้นทะเบียน');
    const isDone = r => !isCancelled(r) && (r.renewed_status === 'ดำเนินการแล้ว' || r.renewed_status === 'เปลี่ยนแหล่งผลิตใหม่');
    const isActive = r => !isCancelled(r) && !isDone(r);

    let filtered = globalData;
    if(q) {
        filtered = globalData.filter(r => 
            (r.trade_name && r.trade_name.toLowerCase().includes(q)) || 
            (r.common_name && r.common_name.toLowerCase().includes(q))
        );
    }

    const actives = filtered.filter(isActive);
    const dones = filtered.filter(isDone);
    const cancels = filtered.filter(isCancelled);
    
    // ค้นหารายการที่ติดปัญหา (มี ❌ หรือ ไม่ผ่าน)
    const fails = actives.filter(r => getFailStepName(r, t) !== null || String(r.note || '').includes('❌'));
    const normalActives = actives.filter(r => !fails.includes(r));

    // 2. อัปเดตสถิติ (Stats Area)
    $('statsArea').innerHTML = `
        <div class="stat-card card-all"><div class="stat-value">${filtered.length}</div><div class="stat-label">${t.stat_all}</div></div>
        <div class="stat-card card-active"><div class="stat-value">${actives.length}</div><div class="stat-label">${t.stat_active}</div></div>
        <div class="stat-card card-done"><div class="stat-value">${dones.length}</div><div class="stat-label">${t.stat_done}</div></div>
        <div class="stat-card card-fail"><div class="stat-value">${fails.length}</div><div class="stat-label">${t.stat_fail}</div></div>
        <div class="stat-card card-cancel"><div class="stat-value" style="color:#64748b">${cancels.length}</div><div class="stat-label">${t.stat_cancel}</div></div>
    `;

    // 3. จัดการปุ่ม Filter (Tabs)
    $('tab-all').innerHTML = `${t.tab_all} <small>(${actives.length})</small>`;
    const countNormalInStep = (key) => normalActives.filter(r => getMilestone(r).key === key).length;
    $('tab-1').innerHTML = `${t.tab_1} <small>(${countNormalInStep('start')})</small>`;
    $('tab-2').innerHTML = `${t.tab_2} <small>(${countNormalInStep('phase1')})</small>`;
    $('tab-3').innerHTML = `${t.tab_3} <small>(${countNormalInStep('analysis')})</small>`;
    $('tab-4').innerHTML = `${t.tab_4} <small>(${countNormalInStep('trial')})</small>`;
    $('tab-5').innerHTML = `${t.tab_5} <small>(${countNormalInStep('phase3')})</small>`;
    $('tab-fail').innerHTML = `${currentLang==='th'?'พบปัญหา':'Issues'} <small>(${fails.length})</small>`;

    // 4. เลือกข้อมูลที่จะแสดงในตารางหลักตาม Filter
    let displayRows = [];
    if (activeFilter === 'fail') {
        displayRows = fails;
    } else if (activeFilter === 'all') {
        displayRows = actives;
        displayRows.sort((a, b) => (fails.includes(a) ? -1 : 1));
    } else {
        displayRows = normalActives.filter(r => getMilestone(r).key === activeFilter);
    }

    // 5. วาดตารางความคืบหน้า (Main Table)
   // --- ส่วนที่ปรับปรุงใหม่ใน Badge ---
// --- ส่วนที่ปรับปรุงใหม่: แสดงขั้นตอนหลัก + เหตุผลสีเทาด้านล่าง ---
$('mainTbody').innerHTML = displayRows.map(r => {
    const ms = getMilestone(r);
    const failStep = getFailStepName(r, t); 
    const isFail = fails.includes(r);
    const st = r.renewed_status || '';
    const custMsg = (r.customer_message || '').trim();

    // 1. ดึงข้อความจากช่องที่ "ไม่ผ่าน" มาโชว์เป็นเหตุผลสีเทา
    let failReason = "";
    if (isFail) {
        // เช็คไล่ลำดับจากขั้นตอนท้ายสุดมาหน้าสุด เพื่อหาข้อความล่าสุดที่ติดปัญหา
        if (String(r.result_phase3 || '').includes('❌') || String(r.result_phase3 || '').includes('ไม่ผ่าน')) failReason = r.result_phase3;
        else if (String(r.plan_trial || '').includes('❌') || String(r.plan_trial || '').includes('ไม่ผ่าน')) failReason = r.plan_trial;
        else if (String(r.analysis_result || '').includes('❌') || String(r.analysis_result || '').includes('ไม่ผ่าน')) failReason = r.analysis_result;
        else if (String(r.result_phase1 || '').includes('❌') || String(r.result_phase1 || '').includes('ไม่ผ่าน')) failReason = r.result_phase1;
    }

    // 2. จัดการ Badge (ข้อความแอดมินมาแทนที่ชื่อประเภทงาน)
    let badgeText = (custMsg && custMsg !== '-') ? custMsg : (isFail ? (currentLang==='th'?'ต้องแก้ไข':'Need Fix') : (st.includes('ต่ออายุ') ? t.renew_label : t.new_reg));
    let badgeBg = isFail ? "var(--danger)" : (st.includes('ต่ออายุ') ? "var(--secondary)" : ((custMsg && custMsg !== '-') ? "#e0f2fe" : "#f1f5f9"));
    let badgeColor = isFail ? "var(--danger-text)" : (st.includes('ต่ออายุ') ? "var(--secondary-dark)" : ((custMsg && custMsg !== '-') ? "#0369a1" : "var(--text-sub)"));

    return `<tr>
        <td>
            <div style="font-weight:700;">${r.trade_name}</div>
            <div style="font-size:12px; color:var(--text-sub)">${t.common_label}: ${r.common_name || '-'}</div>
            <div class="badge-pastel" style="background:${badgeBg}; color:${badgeColor}">
                ${badgeText}
            </div>
        </td>
        <td>
            <span class="status-label" style="color:${isFail ? 'var(--danger-text)' : 'var(--text-main)'}; margin-bottom: 2px;">
                ${isFail ? '⚠️ ' + (failStep || t.pending_fix) : getActualStatusText(r, t)}
            </span>
            
            ${isFail && failReason ? `<div style="font-size: 11px; color: #94a3b8; margin-bottom: 6px; font-style: italic; line-height: 1.2;">${failReason}</div>` : ''}
            
            <div class="progress-bg"><div class="progress-fill" style="width:${ms.pct}%; background:${isFail ? 'var(--danger-text)' : 'var(--primary-dark)'}"></div></div>
            <div style="text-align:right; font-size:10px; margin-top:4px; font-weight:700; color:var(--text-sub)">${ms.pct}%</div>
        </td>
        <td style="font-size:13px; color:var(--text-sub);">
            ${r.note || '-'}
        </td>
    </tr>`;
}).join('');

    // 6. วาดตารางประวัติงานที่สำเร็จ (History Area)
    $('historyArea').innerHTML = dones.length ? dones.map(r => `
        <div style="padding:16px; border-bottom:1px solid #f0fdf4; display:flex; justify-content:space-between; align-items:center;">
            <div>
                <div style="font-weight:700;">${r.trade_name}</div>
                <div style="font-size:12px; color:var(--text-sub)">${t.common_label}: ${r.common_name || '-'}</div>
                <div style="color:var(--success-text); font-size:12px; font-weight:700; margin-top:4px;">✅ ${t.stat_done}</div>
            </div>
            <div style="font-size:12px; color:var(--text-sub); text-align:right;">${r.note || '-'}</div>
        </div>`).join('') : `<div style="text-align:center; padding:20px; color:#94a3b8">${t.no_data}</div>`;
    // 7. ส่วนงานที่ยกเลิก
    if(cancels.length > 0) {
        if(!$('cancelSection')) {
            const div = document.createElement('div'); div.id = 'cancelSection';
            $('contentArea').appendChild(div);
        }
        $('cancelSection').innerHTML = `
            <div style="font-weight:700; font-size:1.1rem; margin: 3rem 0 1rem; color:var(--text-sub)">${t.section_cancel}</div>
            <div class="card-container" style="background:#f8fafc; border-style: dashed;">
                ${cancels.map(r => `
                    <div style="padding:16px; border-bottom:1px solid #e2e8f0; display:flex; justify-content:space-between; align-items:center; opacity:0.8;">
                        <div>
                            <div style="font-weight:700;">${r.trade_name}</div>
                            <div style="font-size:12px; color:var(--text-sub)">${t.common_label}: ${r.common_name || '-'}</div>
                            <span class="badge-pastel" style="background:#fee2e2; color:#ef4444; margin-top:4px;">${t.stat_cancel}</span>
                        </div>
                        <div style="font-size:12px; color:var(--text-sub); text-align:right;">${r.note || '-'}</div>
                    </div>`).join('')}
            </div>`;
    } else if($('cancelSection')) { $('cancelSection').innerHTML = ''; }
}
window.setFilter = (f) => {
    activeFilter = f;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    if(event) event.target.classList.add('active');
    render();
};

$('btnLoad').onclick = async () => {
    const code = $('access_code').value.trim();
    if(!code) return;
    localStorage.setItem('customer_access_code', code);
    const { data: companies } = await sb.from('companies').select('code').or(`code.eq.${code},plain_code.eq.${code}`).limit(1);
    let targetCode = (companies?.length > 0) ? companies[0].code : code;
    const { data } = await sb.from('product_regs').select('*').eq('company_code', targetCode);
    globalData = data || [];
    $('search-product-area').style.display = 'block';
    $('contentArea').style.display = 'block';
    render();
};

function toggleLang() { currentLang = currentLang === 'th' ? 'en' : 'th'; localStorage.setItem('lang', currentLang); updateUI(); }

function updateUI() {
    const t = translations[currentLang];
    $('langBtn').textContent = currentLang === 'th' ? '🇹🇭 TH' : '🇺🇸 EN';
    $('txt-brand').textContent = t.brand;
    $('txt-nav-portal').textContent = t.nav_portal;
    $('access_code').placeholder = t.search_placeholder;
    $('q_product').placeholder = t.search_trade;
    $('btnLoad').textContent = t.btn_load;
    $('txt-milestone-title').textContent = t.milestone_title;
    $('txt-section-progress').textContent = t.section_progress;
    $('txt-section-done').textContent = t.section_done;
    if(globalData.length > 0) render();
}

window.onload = () => {
    updateUI();
    const savedCode = localStorage.getItem('customer_access_code');
    if(savedCode) { $('access_code').value = savedCode; $('btnLoad').click(); }
};
</script>
</body>
</html>
