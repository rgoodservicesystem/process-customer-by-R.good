<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Admin Portal — ระบบจัดการข้อมูลทะเบียน (Clean & Full)</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f8fafc; --card: #ffffff; --border: #e2e8f0; 
    --primary: #0ea5a5; --accent: #0284c7; --danger: #ef4444; 
    --success: #10b981; --warn: #f59e0b; --text: #1e293b;
  }
  * { box-sizing: border-box; }
  body { font-family: "Prompt", sans-serif; background: var(--bg); margin: 0; color: var(--text); }
  
  header { background: #fff; padding: 16px 24px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 1000; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
  .brand { font-weight: 700; font-size: 1.2rem; color: var(--primary); }

  .wrap { max-width: 1600px; margin: 20px auto; padding: 0 20px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
  
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  input, select, button, textarea { padding: 10px 14px; border-radius: 10px; border: 1px solid var(--border); font-size: 14px; outline: none; transition: 0.2s; }
  input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.1); }

  .btn { cursor: pointer; font-weight: 700; border: none; }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-ghost { background: #fff; border: 1px solid var(--border); color: var(--text); }
  .btn-danger { background: #fff; border: 1px solid #fee2e2; color: var(--danger); }
  
  /* Table & Edit Mode */
  .table-box { border-radius: 12px; border: 1px solid var(--border); overflow: auto; max-height: 65vh; background: #fff; }
  table { width: 100%; border-collapse: collapse; min-width: 1600px; }
  th { background: #f1f5f9; padding: 12px; text-align: left; font-size: 13px; font-weight: 700; color: #64748b; position: sticky; top: 0; z-index: 10; border-bottom: 2px solid var(--border); }
  td { padding: 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  
  td.editable { cursor: pointer; border: 1px solid transparent; }
  td.editable:hover { background: #f0fdfa !important; outline: 1px solid var(--primary); }
  td.editing { padding: 0 !important; }
  td.editing input { width: 100%; height: 45px; border: 2px solid var(--primary) !important; padding: 0 10px; border-radius: 0; background: #fff; font-family: inherit; }

  /* Row Status */
  tr.st-done { background-color: #f0fdf4 !important; }
  tr.st-process { background-color: #fffbeb !important; }
  tr.st-renew { background-color: #fdf2f8 !important; }
  tr.st-fail { background-color: #fef2f2 !important; }

  .toolbar-quick { background: #f8fafc; border: 1px dashed var(--primary); padding: 15px; border-radius: 12px; margin-bottom: 15px; }
  .actions-row { display: flex; gap: 4px; justify-content: flex-start; }
</style>
</head>
<body>

<header>
  <div class="brand">ADMIN PORTAL — ระบบจัดการทะเบียน</div>
  <div class="row">
    <div id="userEmail" style="font-weight: 600; color: var(--primary)"></div>
    <button id="signOutBtn" class="btn btn-ghost">ออกระบบ</button>
  </div>
</header>

<div class="wrap">
  <div class="card">
    <div class="row">
      <div style="flex:1; min-width: 300px;">
        <label style="font-weight:700; display:block; margin-bottom:5px;">🏢 เลือกบริษัท</label>
        <select id="companySelect" style="width: 100%;"><option>กำลังโหลด...</option></select>
      </div>
      <div style="flex:1; min-width: 300px;">
        <label style="font-weight:700; display:block; margin-bottom:5px;">🔑 รหัสลูกค้า (RG Code)</label>
        <div class="row">
          <input id="cust_code" placeholder="เช่น RG-1234" style="flex:1">
          <button id="setCodeBtn" class="btn btn-primary">บันทึกรหัส</button>
        </div>
      </div>
      <div style="align-self: flex-end;">
        <button id="expBtn" class="btn btn-ghost">Export Excel</button>
      </div>
    </div>
  </div>

  <div class="toolbar-quick">
    <div style="font-weight:700; font-size:13px; color:var(--primary); margin-bottom:10px;">⚡ Quick Toolbar (คลิกช่องในตารางก่อนแล้วกดปุ่มสัญลักษณ์):</div>
    <div class="row">
      <button class="btn btn-ghost" onclick="quickFill('✅ ผ่าน')">✅ ผ่าน</button>
      <button class="btn btn-ghost" onclick="quickFill('❌ ไม่ผ่าน')">❌ ไม่ผ่าน</button>
      <button class="btn btn-ghost" onclick="quickFill('⏳ รอข้อมูล')">⏳ รอข้อมูล</button>
      <button class="btn btn-ghost" onclick="quickFill('⚠️ แก้ไข')">⚠️ แก้ไข</button>
      <button class="btn btn-ghost" onclick="quickFill('-')">(-) ขีดฆ่า</button>
    </div>
  </div>

  <div class="card" style="padding: 0;">
    <div style="padding: 16px; border-bottom: 1px solid var(--border);" class="row">
      <input id="adminSearch" placeholder="ค้นหาตามชื่อการค้า หรือ ชื่อสามัญ..." style="flex:1">
      <div id="adminCount" style="font-weight:700; color:var(--primary)"></div>
    </div>
    
    <div class="table-box">
      <table>
        <thead>
          <tr>
            <th style="width: 40px;">#</th>
            <th>ชื่อการค้า</th>
            <th>ชื่อสามัญ</th>
            <th>ผู้นำเข้า</th>
            <th>แหล่งผลิต</th>
            <th>เฟส 1</th>
            <th>ผลวิเคราะห์</th>
            <th>ผลทดลอง</th>
            <th>เฟส 3</th>
            <th>หมายเหตุ</th>
            <th>สถานะ</th>
            <th style="width: 180px; text-align: center;">จัดการสถานะ</th>
          </tr>
        </thead>
        <tbody id="tbody">
          <tr><td colspan="12" style="text-align:center; padding: 50px; color: #94a3b8;">กรุณาเลือกบริษัทด้านบนเพื่อเริ่มต้นจัดการข้อมูล</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://vyfjqpwmvjborjrrtpne.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ5ZmpxcHdtdmpib3JqcnJ0cG5lIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjQzMTI4NjcsImV4cCI6MjA3OTg4ODg2N30.pu9ItBYuuQbH53lJmUzPCU2MW67RvCHr2rzhk3UQUw4';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const $ = id => document.getElementById(id);

let currentCompany = '';
let cachedRows = [];

// --- Init ---
document.addEventListener('DOMContentLoaded', async ()=>{
  const { data: { session } } = await sb.auth.getSession();
  if(!session) return window.location.href = 'login.html';
  $('userEmail').textContent = session.user.email;
  loadCompanies();
});

async function loadCompanies(){
  const { data } = await sb.from('companies').select('code,name').order('code');
  $('companySelect').innerHTML = `<option value="">— เลือกบริษัทที่ต้องการจัดการ —</option>` + 
    data.map(c=>`<option value="${c.code}">${c.code} : ${c.name||''}</option>`).join('');
}

$('companySelect').onchange = e => loadDocs(e.target.value);

async function loadDocs(code){
  currentCompany = code;
  if(!code) return;
  const { data } = await sb.from('product_regs').select('*').eq('company_code', code).order('id');
  cachedRows = data || [];
  renderTable();
}

function renderTable(){
  const q = $('adminSearch').value.toLowerCase();
  const filtered = cachedRows.filter(r => [r.trade_name, r.common_name].join(' ').toLowerCase().includes(q));

  $('tbody').innerHTML = filtered.map((r, i) => {
    const st = (r.renewed_status || '').trim();
    let rowCls = '';
    if(st === 'ดำเนินการแล้ว') rowCls = 'st-done';
    else if(st.includes('ไม่ผ่าน')) rowCls = 'st-fail';
    else if(st === 'อยู่ระหว่างดำเนินการ') rowCls = 'st-process';
    else if(st === 'ต่ออายุ') rowCls = 'st-renew';

    return `
      <tr class="${rowCls}">
        <td style="color:#94a3b8; font-size:11px">${i+1}</td>
        <td class="editable" onclick="editCell(this,'${r.id}','trade_name')"><strong>${r.trade_name||'-'}</strong></td>
        <td class="editable" onclick="editCell(this,'${r.id}','common_name')">${r.common_name||'-'}</td>
        <td class="editable" onclick="editCell(this,'${r.id}','importer')">${r.importer||'-'}</td>
        <td class="editable" onclick="editCell(this,'${r.id}','manufacturer_source')">${r.manufacturer_source||'-'}</td>
        <td class="editable" onclick="editCell(this,'${r.id}','result_phase1')">${r.result_phase1||'-'}</td>
        <td class="editable" onclick="editCell(this,'${r.id}','analysis_result')">${r.analysis_result||'-'}</td>
        <td class="editable" onclick="editCell(this,'${r.id}','plan_trial')">${r.plan_trial||'-'}</td>
        <td class="editable" onclick="editCell(this,'${r.id}','result_phase3')">${r.result_phase3||'-'}</td>
        <td class="editable" onclick="editCell(this,'${r.id}','note')">${r.note||'-'}</td>
        <td><small>${st || 'รอดำเนินการ'}</small></td>
        <td>
          <div class="actions-row">
            <button class="btn btn-ghost small" onclick="updateStatus('${r.id}','ดำเนินการแล้ว')">✅</button>
            <button class="btn btn-ghost small" onclick="updateStatus('${r.id}','อยู่ระหว่างดำเนินการ')">⏳</button>
            <button class="btn btn-ghost small" onclick="updateStatus('${r.id}','ไม่ผ่านเกณฑ์')">❌</button>
            <button class="btn btn-ghost small" onclick="updateStatus('${r.id}','ต่ออายุ')">♻️</button>
            <button class="btn btn-danger small" onclick="delRow('${r.id}')">🗑️</button>
          </div>
        </td>
      </tr>
    `;
  }).join('');
  $('adminCount').textContent = `ทั้งหมด ${filtered.length} รายการ`;
}

// --- Logic การแก้ไข (คลิก 1 ทีติดชัวร์) ---
window.editCell = (td, id, field) => {
  if (td.classList.contains('editing')) return;

  const oldVal = td.textContent === '-' ? '' : td.textContent;
  td.classList.add('editing');
  
  const input = document.createElement('input');
  input.value = oldVal;
  input.id = 'activeInputTarget'; // เป้าหมายสำหรับปุ่มลัดสัญลักษณ์
  
  td.innerHTML = '';
  td.appendChild(input);
  input.focus();
  input.select();

  const save = async () => {
    const newVal = input.value.trim();
    if (newVal !== oldVal) {
      td.textContent = '...';
      const { error } = await sb.from('product_regs').update({ [field]: newVal || '-' }).eq('id', id);
      if(!error) {
        const row = cachedRows.find(x => x.id == id);
        if(row) row[field] = newVal || '-';
        renderTable();
      }
    } else {
      td.textContent = oldVal || '-';
    }
    td.classList.remove('editing');
  };

  input.onblur = save;
  input.onkeydown = e => { if(e.key==='Enter') save(); if(e.key==='Escape') renderTable(); };
};

window.quickFill = (icon) => {
  const input = $('activeInputTarget');
  if (input) {
    input.value = icon + ' ' + input.value;
    input.focus();
  } else {
    alert('กรุณาคลิกเลือกช่องในตารางก่อนครับ!');
  }
};

window.updateStatus = async (id, st) => {
  let data = { renewed_status: st };
  if(st === 'ต่ออายุ') data.result_phase1 = '-';
  await sb.from('product_regs').update(data).eq('id', id);
  loadDocs(currentCompany);
};

window.delRow = async id => { if(confirm('ลบรายการนี้?')) { await sb.from('product_regs').delete().eq('id', id); loadDocs(currentCompany); } };
$('adminSearch').oninput = renderTable;
$('signOutBtn').onclick = async () => { await sb.auth.signOut(); window.location.href='login.html'; };

$('setCodeBtn').onclick = async () => {
  const code = $('cust_code').value.trim();
  await sb.from('companies').upsert({ code: currentCompany, plain_code: code }, { onConflict: 'code' });
  alert('บันทึกรหัสลูกค้าเรียบร้อย');
};
</script>
</body>
</html>
